<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <style>

            --primary-color: #6d7993;
            --secondary-color: #9099a8;
            --bg-color: #f4f3f0;

            --text-color: #333333;
            --accent-color: #bfa38a;
            
            /* 更新後的微縮像素愛心配色 */

            --heart-fill: #d36a72;    /* 填充：質感頁面紅色系 */
            --heart-white: #ffffff;   /* 高光：純白色 */

            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(rgba(191, 163, 138, 0.1) 1px, transparent 0);
            background-size: 24px 24px;
        }

        .container {
            width: 100%;
            max-width: 520px; /* 完美寬幅 */
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        header h1 {
            font-weight: 500;
            color: var(--primary-color);
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-size: 1.7rem;
        }

        /* 中間標示：分行顯示 */

            color: var(--secondary-color);
            font-size: 0.95rem;
            line-height: 1.8;
            margin-top: 0;
            margin-bottom: 25px;
            letter-spacing: 3px;
            font-weight: 400;
        }

        /* 靜心儀式區 */
        .ritual-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 35px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 25px;

            height: 360px;
            margin: 0 auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transform: scale(1);
            transition: transform 4s ease-in-out;
        }

            animation: breathe 8s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(0.85); opacity: 0.85; }
            50% { transform: scale(1.1); opacity: 1; }
        }

            position: relative;
            width: 8px;
            height: 8px;
            background: transparent;

            box-shadow: 
                /* Row 1 */
                -24px -48px var(--heart-border), -16px -48px var(--heart-border), -8px -48px var(--heart-border),

                0px -32px var(--heart-fill), 8px -32px var(--heart-fill), 16px -32px var(--heart-fill), 24px -32px var(--heart-fill), 32px -32px var(--heart-fill), 40px -32px var(--heart-border),
                /* Row 4 (高光點 1) */
                -48px -24px var(--heart-border), -40px -24px var(--heart-fill), -32px -24px var(--heart-white), -24px -24px var(--heart-fill), -16px -24px var(--heart-fill), -8px -24px var(--heart-fill),
                0px -24px var(--heart-fill), 8px -24px var(--heart-fill), 16px -24px var(--heart-fill), 24px -24px var(--heart-fill), 32px -24px var(--heart-fill), 40px -24px var(--heart-fill), 48px -24px var(--heart-border),
                /* Row 5 (高光點 2) */
                -48px -16px var(--heart-border), -40px -16px var(--heart-fill), -32px -16px var(--heart-fill), -24px -16px var(--heart-white), -16px -16px var(--heart-fill), -8px -16px var(--heart-fill),
                0px -16px var(--heart-fill), 8px -16px var(--heart-fill), 16px -16px var(--heart-fill), 24px -16px var(--heart-fill), 32px -16px var(--heart-fill), 40px -16px var(--heart-fill), 48px -16px var(--heart-border),
                /* Row 6 */
                -48px -8px var(--heart-border), -40px -8px var(--heart-fill), -32px -8px var(--heart-fill), -24px -8px var(--heart-fill), -16px -8px var(--heart-fill), -8px -8px var(--heart-fill),
                0px -8px var(--heart-fill), 8px -8px var(--heart-fill), 16px -8px var(--heart-fill), 24px -8px var(--heart-fill), 32px -8px var(--heart-fill), 40px -8px var(--heart-fill), 48px -8px var(--heart-border),
                /* Row 7 */
                -48px 0px var(--heart-border), -40px 0px var(--heart-fill), -32px 0px var(--heart-fill), -24px 0px var(--heart-fill), -16px 0px var(--heart-fill), -8px 0px var(--heart-fill),
                0px 0px var(--heart-fill), 8px 0px var(--heart-fill), 16px 0px var(--heart-fill), 24px 0px var(--heart-fill), 32px 0px var(--heart-fill), 40px 0px var(--heart-fill), 48px 0px var(--heart-border),
                /* Row 8 */
                -40px 8px var(--heart-border), -32px 8px var(--heart-fill), -24px 8px var(--heart-fill), -16px 8px var(--heart-fill), -8px 8px var(--heart-fill),
                0px 8px var(--heart-fill), 8px 8px var(--heart-fill), 16px 8px var(--heart-fill), 24px 8px var(--heart-fill), 32px 8px var(--heart-fill), 40px 8px var(--heart-border),
                /* Row 9 */
                -32px 16px var(--heart-border), -24px 16px var(--heart-fill), -16px 16px var(--heart-fill), -8px 16px var(--heart-fill),
                0px 16px var(--heart-fill), 8px 16px var(--heart-fill), 16px 16px var(--heart-fill), 24px 16px var(--heart-fill), 32px 16px var(--heart-border),
                /* Row 10 */
                -24px 24px var(--heart-border), -16px 24px var(--heart-fill), -8px 24px var(--heart-fill),
                0px 24px var(--heart-fill), 8px 24px var(--heart-fill), 16px 24px var(--heart-fill), 24px 24px var(--heart-border),
                /* Row 11 */
                -16px 32px var(--heart-border), -8px 32px var(--heart-fill),
                0px 32px var(--heart-fill), 8px 32px var(--heart-fill), 16px 32px var(--heart-border),
                /* Row 12 */
                -8px 40px var(--heart-border), 0px 40px var(--heart-fill), 8px 40px var(--heart-border),
                /* Row 13 */
                0px 48px var(--heart-border);
        }

        /* 靜心完成後：愛心主體變更為網頁主色（深藍灰色），並釋放柔和光芒 */
        .pixel-heart.enlightened {
            --heart-fill: var(--primary-color);
            filter: drop-shadow(0 0 15px rgba(109, 121, 147, 0.6));
        }

        .ritual-btn, .draw-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 35px;
            font-size: 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(109, 121, 147, 0.2);
        }

        .ritual-btn:hover, .draw-btn:hover {
            background-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(191, 163, 138, 0.3);
        }

        .instruction-text {
            font-size: 1.05rem;
            margin-bottom: 25px;
            color: #555;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.5;
        }

        /* 籤卡樣式 */
        .card-container {
            perspective: 1000px;
            display: none;
            margin-top: 15px;
        }

        .card {
            width: 100%;
            min-height: 350px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 30px 24px;
        }

        .card-front {
            background-color: var(--primary-color);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .card-front-inner {
            border: 1px solid rgba(255, 255, 255, 0.3);
            width: 100%;
            height: 100%;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card-front h3 {
            font-weight: 300;
            letter-spacing: 5px;
            margin: 0;
            font-size: 1.4rem;
        }

        .card-front p {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-top: 10px;
        }

        .card-back {
            background-color: var(--card-bg);
            color: var(--text-color);
            transform: rotateY(180deg);
            border-left: 5px solid var(--accent-color);
            justify-content: space-between;
        }

        .quote-ch {
            font-size: 1.15rem;
            line-height: 1.8;
            font-weight: 500;
            color: #2c3e50;
            margin-bottom: 18px;
            word-break: break-all;
        }

        .quote-en {
            font-size: 0.88rem;
            line-height: 1.6;
            color: #7f8c8d;
            font-style: italic;
            word-break: break-word;
        }

        .card-footer {
            font-size: 0.78rem;
            color: var(--secondary-color);
            margin-top: 15px;
            border-top: 1px dashed #eee;
            width: 100%;
            padding-top: 10px;
        }

        /* 結尾祝福文字 */
        .blessing-text {
            display: none;
            font-size: 1.1rem;
            color: #bfa38a;
            margin-top: 25px;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.6;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .actions {
            margin-top: 20px;
            display: none;
            gap: 15px;
            justify-content: center;
        }

        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--secondary-color);
            color: var(--secondary-color);
            box-shadow: none;
        }
        .btn-secondary:hover {
            background-color: rgba(0,0,0,0.02);
            color: var(--text-color);
            border-color: var(--text-color);
            box-shadow: none;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>每日智慧語錄<br><span style="font-size: 1.25rem; font-weight: 300; letter-spacing: 1px;">Maxims of Wisdom</span></h1>
        <div class="header-sub">
            日日省思 心成長躍進<br>
            走過愛與和平的足跡<br>

        </div>
    </header>

    <div class="ritual-container" id="ritualContainer">

        </div>
        <div class="instruction-text" id="instructionText">

        </div>
        <button class="ritual-btn" id="startRitualBtn" onclick="startRitual()">開始 10 秒靜心儀式</button>
        <button class="draw-btn" id="drawBtn" onclick="drawQuote()" style="display: none;">抽取今日指引</button>
    </div>

    <div class="card-container" id="cardContainer">
        <div class="card" id="quoteCard" onclick="flipCard()">
            <div class="card-face card-front">
                <div class="card-front-inner">
                    <h3>智慧指引</h3>
                    <p>點擊翻開卡片</p>
                </div>
            </div>
            <div class="card-face card-back">
                <div></div> <div>
                    <div class="quote-ch" id="quoteCh">語錄載入中...</div>
                    <div class="quote-en" id="quoteEn">Loading...</div>
                </div>
                <div class="card-footer" id="quoteIndex">
                    智慧語錄
                </div>
            </div>
        </div>
    </div>

    <div class="blessing-text" id="blessingText">
        祝福你 天天新生<br>迎向生命心氣象
    </div>

    <div class="actions" id="actionArea">
        <button class="ritual-btn btn-secondary" onclick="resetAll()">再次靜心抽籤</button>
    </div>
</div>

<script>
    // 31則智慧語錄數據
    const quotes = [
        {

        pixelContainer.classList.add('breathing');
        
        let seconds = 10;
        instruction.innerHTML = `閉上雙眼，深呼吸...<br>(還剩 ${seconds} 秒)`;
        
        const countdown = setInterval(() => {
            seconds--;
            if (seconds > 5) {
                instruction.innerHTML = `緩緩吸氣，感受宇宙能量...<br>(還剩 ${seconds} 秒)`;
            } else if (seconds > 0) {
                instruction.innerHTML = `慢慢呼氣，放下塵世雜念...<br>(還剩 ${seconds} 秒)`;
            } else {
                clearInterval(countdown);
                pixelContainer.classList.remove('breathing');
                pixelHeart.classList.add('enlightened'); // 靜心完主體轉為深藍灰亮起
                instruction.innerHTML = "心靈已歸於平靜，<br>請抽取今天的智慧指引。";
                drawBtn.style.display = 'inline-block';
            }
        }, 1000);
    }

    // 抽籤
    function drawQuote() {
        const randomIndex = Math.floor(Math.random() * quotes.length);
        const selectedQuote = quotes[randomIndex];

        document.getElementById('quoteCh').innerHTML = selectedQuote.ch;
        document.getElementById('quoteEn').innerHTML = selectedQuote.en;
        document.getElementById('quoteIndex').textContent = `Maxims of Wisdom ・ 第 ${randomIndex + 1} 則`;

        ritualContainer.style.display = 'none';
        cardContainer.style.display = 'block';
        
        setTimeout(() => {
            flipCard();
        }, 500);
    }

    function flipCard() {
        quoteCard.classList.add('flipped');
        
        setTimeout(() => {
            blessingText.style.display = 'block';
            actionArea.style.display = 'flex';
        }, 500);
    }

    function resetAll() {
        quoteCard.classList.remove('flipped');
        cardContainer.style.display = 'none';
        actionArea.style.display = 'none';
        blessingText.style.display = 'none';
        
        ritualContainer.style.display = 'block';
        startBtn.style.display = 'inline-block';
        drawBtn.style.display = 'none';
        pixelHeart.classList.remove('enlightened');
        instruction.innerHTML = "在開始新的一天前，<br>讓心靈沉靜下來。";
    }
</script>

</body>
</html>
